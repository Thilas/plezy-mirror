name: Sync Plezy releases

on:
  schedule:
    - cron: 0 0/6 * * *
  workflow_dispatch:
    inputs:
      max_releases:
        description: Maximum number of releases to sync
        type: number

permissions:
  contents: write

jobs:
  release:
    name: Sync Plezy releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Sync Plezy releases
        shell: pwsh
        run: ./Sync-GitHubReleases.ps1 -MaxReleases $env:MAX_RELEASES -Verbose
        env:
          GITHUB_TOKEN : ${{ secrets.GITHUB_TOKEN }}
          MAX_RELEASES : ${{ inputs.max_releases || 100 }}
